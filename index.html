<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小孔成像模擬器</title>
<style>
  :root{
    --bg:#f3f6ff; --card:#ffffff; --ink:#27304d; --muted:#6b7394;
    --primary:#4361ee; --primary-d:#3047c4; --accent:#ff9f1c;
    --ok:#2a9d8f; --bad:#e76f51;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
  }
  header{ text-align:center; padding:18px 12px 6px; }
  header h1{ margin:0; font-size:1.7rem; }
  header p{ margin:4px 0 0; color:var(--muted); font-size:.95rem; }
  nav{ display:flex; justify-content:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .tab{
    border:2px solid var(--primary); background:#fff; color:var(--primary);
    padding:8px 22px; border-radius:999px; font-size:1rem; font-weight:700; cursor:pointer;
  }
  .tab.active{ background:var(--primary); color:#fff; }
  main{ max-width:1100px; margin:0 auto; padding:0 12px 40px; }
  .view{ display:none; }
  .view.active{ display:block; }
  .card{
    background:var(--card); border-radius:16px; padding:16px;
    box-shadow:0 4px 18px rgba(40,50,100,.10); margin-bottom:14px;
  }
  .card h3{ margin:0 0 8px; font-size:1.05rem; }

  /* ---------- 實驗區 ---------- */
  #scene{
    width:100%; height:auto; display:block; border-radius:12px;
    touch-action:none; background:#1c2140;
  }
  .hint{ font-size:.88rem; color:var(--muted); margin:6px 2px 0; }
  .grid{ display:grid; grid-template-columns:1.1fr .9fr; gap:14px; }
  @media(max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .ctrl{ margin-bottom:12px; }
  .ctrl label.t{ font-weight:700; display:block; margin-bottom:4px; }
  .btn-group{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    border:2px solid #cfd6f5; background:#f7f9ff; color:var(--ink);
    padding:6px 12px; border-radius:10px; cursor:pointer; font-size:.95rem;
  }
  .chip.on{ border-color:var(--primary); background:#e6ebff; font-weight:700; }
  input[type=range]{ width:100%; accent-color:var(--primary); }
  .row{ display:flex; align-items:center; gap:8px; }
  .row span.v{ min-width:90px; text-align:right; font-size:.9rem; color:var(--muted); }
  .view-box{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  #screenView{ width:100%; max-width:340px; border-radius:10px; border:3px solid #444a66; }
  #plateView{ width:120px; border-radius:10px; border:3px solid #444a66; background:#9aa0b5; }
  .caption{ font-size:.85rem; color:var(--muted); margin-top:4px; }
  .info-table{ width:100%; border-collapse:collapse; font-size:.95rem; }
  .info-table td{ padding:4px 6px; border-bottom:1px dashed #dde2f5; }
  .info-table td:first-child{ color:var(--muted); width:42%; }
  .note{
    background:#fff8e6; border-left:5px solid var(--accent);
    padding:8px 10px; border-radius:8px; font-size:.92rem; margin-top:8px;
  }
  .go-btn{
    display:block; width:100%; margin-top:6px; padding:12px; font-size:1.05rem; font-weight:700;
    color:#fff; background:var(--accent); border:none; border-radius:12px; cursor:pointer;
  }
  .go-btn:hover{ filter:brightness(.95); }
  .go-btn.blue{ background:var(--primary); }
  .small-btn{
    border:2px solid #cfd6f5; background:#fff; border-radius:10px; padding:6px 12px; cursor:pointer;
  }

  /* ---------- 練習區 ---------- */
  .progress{ height:10px; background:#e3e8ff; border-radius:99px; overflow:hidden; }
  #bar{ height:100%; width:0; background:linear-gradient(90deg,#4361ee,#4cc9f0); transition:width .3s; }
  .qhead{ display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; color:var(--muted); font-weight:700; flex-wrap:wrap; gap:6px; }
  #qtext{ font-size:1.25rem; margin:8px 0 14px; }
  #opts{ display:grid; gap:10px; }
  .opt{
    text-align:left; padding:12px 16px; font-size:1.05rem; border-radius:12px;
    border:2px solid #cfd6f5; background:#f7f9ff; cursor:pointer; color:var(--ink);
  }
  .opt:hover:not(:disabled){ border-color:var(--primary); background:#eaeeff; }
  .opt.right{ background:#d9f5ee; border-color:var(--ok); font-weight:700; }
  .opt.wrong{ background:#fde5de; border-color:var(--bad); text-decoration:line-through; color:#999; }
  .opt:disabled{ cursor:not-allowed; }
  .fb{ min-height:0; margin-top:12px; padding:0; border-radius:12px; font-size:1.05rem; }
  .fb.ok{ background:#d9f5ee; padding:12px 14px; animation:pop .4s; }
  .fb.bad{ background:#fde5de; padding:12px 14px; animation:shake .4s; }
  .fb .big{ font-size:1.8rem; vertical-align:middle; }
  @keyframes pop{ 0%{transform:scale(.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  #nextBtn{ display:none; margin-top:12px; padding:10px 24px; font-size:1.05rem; font-weight:700;
    background:var(--primary); color:#fff; border:none; border-radius:12px; cursor:pointer; }
  .goexp{ margin-top:18px; padding-top:14px; border-top:2px dashed #dde2f5; }
  #result{ display:none; text-align:center; }
  #result .trophy{ font-size:3.5rem; }
  .nums{ display:flex; justify-content:center; gap:18px; margin:12px 0; flex-wrap:wrap; }
  .num-box{ padding:12px 28px; border-radius:14px; font-size:1.1rem; font-weight:700; }
  .num-box b{ font-size:2.2rem; display:block; }
  .num-ok{ background:#d9f5ee; color:#1f7a6f; }
  .num-bad{ background:#fde5de; color:#b4472d; }
  .review{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0 14px; }
  .review span{ padding:4px 10px; border-radius:99px; background:#f0f3ff; font-size:.9rem; }
  .row-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .row-btns button{ padding:10px 22px; font-size:1rem; font-weight:700; border-radius:12px; border:none; cursor:pointer; color:#fff; }
  #fx{ position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:999; }
  footer{ text-align:center; color:var(--muted); font-size:.85rem; padding-bottom:20px; }
</style>
</head>
<body>

<header>
  <h1>🔦 小孔成像模擬器</h1>
  <p>拖曳蠟燭與紙屏，觀察像的大小、方向與清晰度如何改變</p>
</header>

<nav>
  <button class="tab active" id="tabExp">🔬 實驗區</button>
  <button class="tab" id="tabPrac">📝 練習區</button>
</nav>

<main>

<!-- ================= 實驗區 ================= -->
<section id="exp" class="view active">
  <div class="card">
    <canvas id="scene" width="960" height="420"></canvas>
    <p class="hint">👆 直接用滑鼠或手指左右拖曳「蠟燭」或「紙屏」；也可以使用下方滑桿微調。</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>⚙️ 實驗設定</h3>

      <div class="ctrl">
        <label class="t">小孔形狀</label>
        <div class="btn-group" id="shapeBtns">
          <button class="chip on" data-shape="circle">● 圓形</button>
          <button class="chip" data-shape="square">■ 正方形</button>
          <button class="chip" data-shape="triangle">▲ 三角形</button>
          <button class="chip" data-shape="star">★ 星形</button>
          <button class="chip" data-shape="heart">♥ 愛心</button>
        </div>
      </div>

      <div class="ctrl">
        <label class="t">小孔大小</label>
        <div class="row">
          <input type="range" id="sizeRange" min="2" max="24" step="1" value="10">
          <span class="v" id="sizeVal"></span>
        </div>
      </div>

      <div class="ctrl">
        <label class="t">小孔數量</label>
        <div class="btn-group" id="holeBtns">
          <button class="chip on" data-n="1">1 個孔</button>
          <button class="chip" data-n="2">2 個孔</button>
          <button class="chip" data-n="3">3 個孔</button>
        </div>
      </div>

      <div class="ctrl">
        <label class="t">蠟燭位置</label>
        <div class="row"><input type="range" id="candleRange" min="100" max="410" step="1"><span class="v" id="uVal"></span></div>
      </div>

      <div class="ctrl">
        <label class="t">紙屏位置</label>
        <div class="row"><input type="range" id="screenRange" min="530" max="900" step="1"><span class="v" id="vVal"></span></div>
      </div>

      <div class="row" style="gap:14px;flex-wrap:wrap">
        <label><input type="checkbox" id="rayChk" checked> 顯示光線</label>
        <button class="small-btn" id="resetBtn">↺ 重置位置</button>
      </div>
    </div>

    <div class="card">
      <h3>🔍 紙屏上的像</h3>
      <div class="view-box">
        <div>
          <canvas id="screenView" width="340" height="340"></canvas>
          <div class="caption">紙屏正面（暗室中所見）</div>
        </div>
        <div>
          <canvas id="plateView" width="120" height="200"></canvas>
          <div class="caption">小孔板正面</div>
        </div>
      </div>

      <table class="info-table" style="margin-top:10px">
        <tr><td>物距 u（蠟燭→孔）</td><td id="iU"></td></tr>
        <tr><td>像距 v（孔→紙屏）</td><td id="iV"></td></tr>
        <tr><td>像高 ÷ 物高</td><td id="iK"></td></tr>
        <tr><td>像高（燭高約 8.3 cm）</td><td id="iH"></td></tr>
        <tr><td>像的大小</td><td id="iSize"></td></tr>
        <tr><td>亮度</td><td id="iBright"></td></tr>
      </table>
      <div class="note" id="noteBox"></div>
    </div>
  </div>

  <div class="card">
    <button class="go-btn" id="toPrac">📝 前往練習區</button>
  </div>
</section>

<!-- ================= 練習區 ================= -->
<section id="prac" class="view">
  <div class="card">
    <div id="quiz">
      <div class="progress"><div id="bar"></div></div>
      <div class="qhead">
        <span id="qno"></span>
        <span id="score"></span>
      </div>
      <h2 id="qtext"></h2>
      <div id="opts"></div>
      <div id="fb" class="fb"></div>
      <button id="nextBtn">下一題 ➜</button>
    </div>

    <div id="result">
      <div class="trophy">🏆</div>
      <h2 id="resTitle">練習完成！</h2>
      <div class="nums">
        <div class="num-box num-ok">✅ 答對<b id="resOk">0</b>題</div>
        <div class="num-box num-bad">❌ 答錯<b id="resBad">0</b>題</div>
      </div>
      <p class="hint">（第一次作答就答對的才算「答對」，曾經答錯過的題目算「答錯」）</p>
      <div class="review" id="review"></div>
      <div class="row-btns">
        <button style="background:var(--primary)" id="restartBtn">🔁 重新練習</button>
      </div>
    </div>

    <div class="goexp">
      <button class="go-btn blue" id="toExp">🔬 回到實驗區</button>
    </div>
  </div>
</section>

</main>

<footer>小孔成像模擬器・像高 ÷ 物高 ＝ 像距 ÷ 物距</footer>
<canvas id="fx"></canvas>

<script>
(() => {
/* =====================================================
 *  共用常數
 * ===================================================== */
const W = 960, H = 420;
const AX = 205;                 // 光軸（水平中心線）y 座標
const BX = 470;                 // 小孔板 x 座標（固定）
const SCR_TOP = 35, SCR_BOT = 375, BENCH = 378;
const OBJ_TIP = -50, OBJ_BASE = 33;   // 蠟燭火焰尖端 / 底部（相對光軸）
const OBJ_H = OBJ_BASE - OBJ_TIP;     // 83 px = 8.3 cm（10px = 1cm）
const HOLE_Y = { 1:[0], 2:[-50,50], 3:[-85,0,85] };

const st = { candleX:230, screenX:720, shape:'circle', r:10, holes:1, rays:true };
const DEFAULT = { candleX:230, screenX:720 };

const $ = id => document.getElementById(id);
const cv = $('scene'), cx = cv.getContext('2d');
const sv = $('screenView'), sc = sv.getContext('2d');
const pv = $('plateView'), pc = pv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = 340; layer.height = 340;
const lc = layer.getContext('2d');

/* =====================================================
 *  孔形幾何
 * ===================================================== */
function poly(shape, r){
  switch(shape){
    case 'square':   return [[-r,-r],[r,-r],[r,r],[-r,r]];
    case 'triangle': return [[0,-1.15*r],[1.1*r,0.85*r],[-1.1*r,0.85*r]];
    case 'star': {
      const p=[];
      for(let i=0;i<10;i++){
        const a=-Math.PI/2+i*Math.PI/5, rr=(i%2)?0.6*r:1.2*r;
        p.push([rr*Math.cos(a), rr*Math.sin(a)]);
      }
      return p;
    }
    case 'heart': {
      const p=[], s=r/14;
      for(let i=0;i<48;i++){
        const t=i/48*2*Math.PI;
        p.push([ s*16*Math.pow(Math.sin(t),3),
                -s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) - 2.5*s ]);
      }
      return p;
    }
    default: return null; // circle
  }
}
function inPoly(p,x,y){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0], yi=p[i][1], xj=p[j][0], yj=p[j][1];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) c=!c;
  }
  return c;
}
function yExt(shape,r){
  const p=poly(shape,r);
  if(!p) return [-r,r];
  let a=1e9,b=-1e9; p.forEach(q=>{a=Math.min(a,q[1]);b=Math.max(b,q[1]);});
  return [a,b];
}
function shapePath(c,shape,r,x,y,s=1){
  const p=poly(shape,r);
  c.beginPath();
  if(!p){ c.arc(x,y,r*s,0,Math.PI*2); }
  else { p.forEach((q,i)=>{ const px=x+q[0]*s, py=y+q[1]*s; i?c.lineTo(px,py):c.moveTo(px,py); }); c.closePath(); }
}
const sampleCache = {};
function getSamples(shape,r,n){
  const key=shape+'|'+r+'|'+n;
  if(sampleCache[key]) return sampleCache[key];
  const R=r*1.2, p=poly(shape,r), pts=[];
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const x=-R+(i+.5)*2*R/n, y=-R+(j+.5)*2*R/n;
    if(p?inPoly(p,x,y):(x*x+y*y<=r*r)) pts.push([x,y]);
  }
  if(!pts.length) pts.push([0,0]);
  return sampleCache[key]={pts, step:2*R/n};
}
const areaCache={};
function areaOf(shape,r){
  const key=shape+'|'+r; if(areaCache[key]) return areaCache[key];
  const N=40,R=r*1.2,p=poly(shape,r); let cnt=0;
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const x=-R+(i+.5)*2*R/N, y=-R+(j+.5)*2*R/N;
    if(p?inPoly(p,x,y):(x*x+y*y<=r*r)) cnt++;
  }
  return areaCache[key]=cnt*Math.pow(2*R/N,2);
}

/* =====================================================
 *  蠟燭路徑（物體座標：光軸為 0，y 向下）
 * ===================================================== */
const P_FLAME = new Path2D('M0,-50 C12,-36 11,-23 0,-19 C-11,-23 -12,-36 0,-50Z');
const P_INNER = new Path2D('M0,-38 C5,-31 5,-25 0,-21 C-5,-25 -5,-31 0,-38Z');
const P_BODY  = new Path2D(); P_BODY.rect(-9,-17,18,50);
const P_WICK  = new Path2D(); P_WICK.rect(-1,-20,2,4);

/* =====================================================
 *  繪製實驗場景
 * ===================================================== */
function drawScene(){
  const c=cx, u=BX-st.candleX, v=st.screenX-BX, k=v/u;
  c.clearRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1c2140'); g.addColorStop(1,'#2d3561');
  c.fillStyle=g; c.fillRect(0,0,W,H);

  // 工作台
  c.fillStyle='#6d4c41'; c.fillRect(0,BENCH,W,14);
  c.fillStyle='#4e342e'; c.fillRect(0,BENCH+14,W,H-BENCH-14);

  // 光軸
  c.save(); c.setLineDash([6,6]); c.strokeStyle='rgba(255,255,255,.22)';
  c.beginPath(); c.moveTo(0,AX); c.lineTo(W,AX); c.stroke(); c.restore();

  // 小孔板（含孔洞）
  const [y0,y1]=yExt(st.shape,st.r);
  const gaps=HOLE_Y[st.holes].map(h=>[AX+h+y0, AX+h+y1]);
  c.fillStyle='#aab0c6';
  let y=20;
  gaps.forEach(gp=>{ c.fillRect(BX-5,y,10,gp[0]-y); y=gp[1]; });
  c.fillRect(BX-5,y,10,BENCH-y);
  c.fillStyle='#e0e4f5'; c.font='bold 14px sans-serif'; c.textAlign='center';
  c.fillText('小孔板',BX,15);

  // 蠟燭
  c.save(); c.translate(st.candleX,AX);
  const glow=c.createRadialGradient(0,-35,2,0,-35,70);
  glow.addColorStop(0,'rgba(255,210,100,.55)'); glow.addColorStop(1,'rgba(255,210,100,0)');
  c.fillStyle=glow; c.beginPath(); c.arc(0,-35,70,0,Math.PI*2); c.fill();
  c.fillStyle='#f6e7c1'; c.fill(P_BODY);
  c.strokeStyle='#cdb98a'; c.lineWidth=1; c.stroke(P_BODY);
  c.fillStyle='#444'; c.fill(P_WICK);
  c.fillStyle='#ff9f1c'; c.fill(P_FLAME);
  c.fillStyle='#ffe66d'; c.fill(P_INNER);
  c.restore();
  // 燭台
  c.fillStyle='#8d6e63'; c.fillRect(st.candleX-20,AX+OBJ_BASE,40,6);
  c.fillRect(st.candleX-3,AX+OBJ_BASE+6,6,BENCH-(AX+OBJ_BASE+6));
  c.fillStyle='#ffd166'; c.font='bold 14px sans-serif'; c.textAlign='center';
  c.fillText('蠟燭 ↔',st.candleX,AX+OBJ_TIP-26);

  // 紙屏
  c.fillStyle='#f5f0e1'; c.fillRect(st.screenX,SCR_TOP,8,SCR_BOT-SCR_TOP);
  c.strokeStyle='#bbb'; c.strokeRect(st.screenX,SCR_TOP,8,SCR_BOT-SCR_TOP);
  c.fillStyle='#8d6e63'; c.fillRect(st.screenX-8,SCR_BOT,24,BENCH-SCR_BOT);
  c.fillStyle='#e0e4f5'; c.font='bold 14px sans-serif';
  c.fillText('↔ 紙屏',st.screenX+4,SCR_TOP-8);

  // 光線
  const holes=HOLE_Y[st.holes];
  if(st.rays){
    c.lineWidth=1.4;
    holes.forEach(hy=>{
      [[OBJ_TIP,'rgba(255,209,102,.85)'],[OBJ_BASE,'rgba(123,223,242,.85)']].forEach(([oy,col])=>{
        c.strokeStyle=col;
        c.beginPath(); c.moveTo(st.candleX,AX+oy); c.lineTo(BX,AX+hy); c.stroke();
        const ey=AX+hy*(1+k)-oy*k;
        c.save(); c.beginPath(); c.rect(BX,SCR_TOP,v,SCR_BOT-SCR_TOP); c.clip();
        c.beginPath(); c.moveTo(BX,AX+hy); c.lineTo(st.screenX,ey); c.stroke();
        c.restore();
      });
    });
  }

  // 紙屏上的像（側視）
  holes.forEach(hy=>{
    const a=AX+hy*(1+k)-OBJ_TIP*k, b=AX+hy*(1+k)-OBJ_BASE*k;
    c.save(); c.beginPath(); c.rect(st.screenX-8,SCR_TOP,8,SCR_BOT-SCR_TOP); c.clip();
    c.strokeStyle='#ff9f1c'; c.lineWidth=6;
    c.beginPath(); c.moveTo(st.screenX-3,a); c.lineTo(st.screenX-3,b); c.stroke();
    c.restore();
  });

  // 距離標示
  c.strokeStyle='#cfd6f5'; c.fillStyle='#cfd6f5'; c.lineWidth=1.2; c.font='13px sans-serif';
  const dy=H-14;
  c.beginPath(); c.moveTo(st.candleX,dy); c.lineTo(BX,dy); c.moveTo(st.candleX,dy-5); c.lineTo(st.candleX,dy+5); c.moveTo(BX,dy-5); c.lineTo(BX,dy+5); c.stroke();
  c.beginPath(); c.moveTo(BX,dy); c.lineTo(st.screenX,dy); c.moveTo(st.screenX,dy-5); c.lineTo(st.screenX,dy+5); c.stroke();
  c.textAlign='center';
  c.fillText('物距 u = '+(u/10).toFixed(1)+' cm',(st.candleX+BX)/2,dy-6);
  c.fillText('像距 v = '+(v/10).toFixed(1)+' cm',(BX+st.screenX)/2,dy-6);
}

/* =====================================================
 *  繪製紙屏正面的像
 * ===================================================== */
function brightnessOf(){
  const v=st.screenX-BX;
  const B=areaOf(st.shape,st.r)*st.holes/(v*v);
  return Math.max(.25,Math.min(1,.25+.75*Math.sqrt(B/.012)));
}
function renderScreen(){
  const u=BX-st.candleX, v=st.screenX-BX, k=v/u;
  const n=Math.max(3,Math.min(11,Math.ceil(2.4*st.r*(1+k)/4)));
  const {pts,step}=getSamples(st.shape,st.r,n);
  const a=1-Math.pow(0.08,1/pts.length);

  lc.setTransform(1,0,0,1,0,0); lc.clearRect(0,0,340,340);
  HOLE_Y[st.holes].forEach(hy=>{
    pts.forEach(([dx,dy])=>{
      lc.setTransform(-k,0,0,-k,170+dx*(1+k),170+(hy+dy)*(1+k));
      lc.globalAlpha=a;
      lc.fillStyle='#f6d9a6'; lc.fill(P_BODY);
      lc.fillStyle='#ff8a00'; lc.fill(P_FLAME);
      lc.fillStyle='#ffe680'; lc.fill(P_INNER);
    });
  });
  lc.setTransform(1,0,0,1,0,0); lc.globalAlpha=1;

  sc.setTransform(1,0,0,1,0,0); sc.clearRect(0,0,340,340);
  sc.fillStyle='#2b2f45'; sc.fillRect(0,0,340,340);
  sc.strokeStyle='rgba(255,255,255,.12)'; sc.setLineDash([4,6]);
  sc.beginPath(); sc.moveTo(170,0); sc.lineTo(170,340); sc.moveTo(0,170); sc.lineTo(340,170); sc.stroke();
  sc.setLineDash([]);
  sc.save();
  const blurPx = pts.length>1 ? Math.min(3, step*(1+k)/2.2) : 0;
  if('filter' in sc && blurPx>0.3) sc.filter='blur('+blurPx.toFixed(1)+'px)';
  sc.globalAlpha=brightnessOf();
  sc.drawImage(layer,0,0);
  sc.restore();
}

/* 小孔板正面小圖 */
function renderPlate(){
  const s=200/340;
  pc.clearRect(0,0,120,200);
  pc.fillStyle='#9aa0b5'; pc.fillRect(0,0,120,200);
  HOLE_Y[st.holes].forEach(hy=>{
    shapePath(pc,st.shape,st.r,60,100+hy*s,s);
    pc.fillStyle='#111426'; pc.fill();
    pc.strokeStyle='#e0e4f5'; pc.lineWidth=1; pc.stroke();
  });
}

/* =====================================================
 *  資訊面板
 * ===================================================== */
function updateInfo(){
  const u=BX-st.candleX, v=st.screenX-BX, k=v/u;
  const B=brightnessOf();
  $('uVal').textContent=(u/10).toFixed(1)+' cm';
  $('vVal').textContent=(v/10).toFixed(1)+' cm';
  $('sizeVal').textContent='孔徑 '+(st.r*2)+' mm';
  $('iU').textContent=(u/10).toFixed(1)+' cm';
  $('iV').textContent=(v/10).toFixed(1)+' cm';
  $('iK').textContent=k.toFixed(2)+' 倍';
  $('iH').textContent=(OBJ_H*k/10).toFixed(1)+' cm'+(OBJ_H*k>SCR_BOT-SCR_TOP?'（超出紙屏）':'');
  $('iSize').textContent = k>1.05?'🔼 放大（倒立）' : k<0.95?'🔽 縮小（倒立）' : '⏺ 約等大（倒立）';
  $('iBright').textContent = Math.round(B*100)+' %';

  const tips=[];
  if(st.r<=5) tips.push('孔很小：像清楚，但比較暗。');
  else if(st.r>=15) tips.push('孔很大：像比較亮，但變得模糊，並帶有孔的形狀。');
  else tips.push('孔大小適中：亮度與清晰度取得平衡。');
  if(st.holes>1){
    const sep=(HOLE_Y[st.holes][1]-HOLE_Y[st.holes][0])*(1+k);
    tips.push(st.holes+' 個孔會產生 '+st.holes+' 個像；'+(sep>OBJ_H*k?'目前像已分開。':'目前像互相重疊。'));
  }
  tips.push('像高 ÷ 物高 = 像距 ÷ 物距。');
  $('noteBox').innerHTML='💡 '+tips.join('<br>💡 ');

  $('candleRange').value=st.candleX; $('screenRange').value=st.screenX;
  $('sizeRange').value=st.r;
}
function refresh(){ drawScene(); renderScreen(); renderPlate(); updateInfo(); }

/* =====================================================
 *  互動：拖曳 / 控制
 * ===================================================== */
let drag=null;
function pos(e){
  const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
function hit(p){
  const dC=Math.abs(p.x-st.candleX), dS=Math.abs(p.x-(st.screenX+4));
  const okC=dC<40 && p.y>AX-80 && p.y<BENCH+5;
  const okS=dS<24 && p.y>SCR_TOP-25;
  if(okC&&okS) return dC<dS?'candle':'screen';
  return okC?'candle':okS?'screen':null;
}
cv.addEventListener('pointerdown',e=>{
  const p=pos(e), h=hit(p);
  if(!h) return;
  drag={type:h, off:p.x-(h==='candle'?st.candleX:st.screenX)};
  cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e);
  if(!drag){ cv.style.cursor=hit(p)?'grab':'default'; return; }
  const x=p.x-drag.off;
  if(drag.type==='candle') st.candleX=Math.max(100,Math.min(410,x));
  else st.screenX=Math.max(530,Math.min(900,x));
  refresh();
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ drag=null; cv.style.cursor='default'; }));

$('candleRange').addEventListener('input',e=>{ st.candleX=+e.target.value; refresh(); });
$('screenRange').addEventListener('input',e=>{ st.screenX=+e.target.value; refresh(); });
$('sizeRange').addEventListener('input',e=>{ st.r=+e.target.value; refresh(); });
$('rayChk').addEventListener('change',e=>{ st.rays=e.target.checked; refresh(); });
$('resetBtn').addEventListener('click',()=>{ st.candleX=DEFAULT.candleX; st.screenX=DEFAULT.screenX; refresh(); });
$('shapeBtns').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  st.shape=b.dataset.shape;
  [...$('shapeBtns').children].forEach(x=>x.classList.toggle('on',x===b));
  refresh();
});
$('holeBtns').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  st.holes=+b.dataset.n;
  [...$('holeBtns').children].forEach(x=>x.classList.toggle('on',x===b));
  refresh();
});

/* =====================================================
 *  分頁切換
 * ===================================================== */
function showView(name){
  $('exp').classList.toggle('active',name==='exp');
  $('prac').classList.toggle('active',name==='prac');
  $('tabExp').classList.toggle('active',name==='exp');
  $('tabPrac').classList.toggle('active',name==='prac');
  window.scrollTo({top:0,behavior:'smooth'});
  if(name==='exp') refresh();
}
$('tabExp').onclick=()=>showView('exp');
$('tabPrac').onclick=()=>showView('prac');
$('toExp').onclick=()=>showView('exp');
$('toPrac').onclick=()=>showView('prac');

/* =====================================================
 *  練習區
 * ===================================================== */
const QS=[
 {q:'蠟燭和小孔板的位置都不動，只把紙屏「往後移、離小孔更遠」，紙屏上的像會怎麼變？',
  o:['變大','變小','大小不變'],a:0,
  h:'像高 ÷ 物高 ＝ 像距 ÷ 物距。像距變長，這個比值會變怎樣？',
  e:'像距變大、物距不變 → 像變大。'},
 {q:'紙屏和小孔板的位置都不動，把蠟燭「移近小孔」，像會怎麼變？',
  o:['變大','變小','大小不變'],a:0,
  h:'物距變小時，像距 ÷ 物距 的比值會變大還是變小？',
  e:'物距變小、像距不變 → 像變大。'},
 {q:'紙屏和小孔板的位置都不動，把蠟燭「遠離小孔」，像會怎麼變？',
  o:['變大','變小','大小不變'],a:1,
  h:'物距變大，像距 ÷ 物距 的比值會怎樣？',
  e:'物距變大、像距不變 → 像變小。'},
 {q:'蠟燭和小孔板的位置都不動，把紙屏「移近小孔」，像會怎麼變？',
  o:['變大','變小','大小不變'],a:1,
  h:'像距變短，像高 ÷ 物高 的比值會怎樣？',
  e:'像距變小、物距不變 → 像變小。'},
 {q:'蠟燭高 6 cm，蠟燭到小孔 20 cm，小孔到紙屏 10 cm，紙屏上的像高是多少？',
  o:['3 cm','6 cm','12 cm'],a:0,
  h:'像高 = 物高 × (像距 ÷ 物距)，先算出 10 ÷ 20 是多少。',
  e:'像高 = 6 × 10 ÷ 20 = 3 cm。'},
 {q:'蠟燭高 4 cm，物距 10 cm，像距 30 cm，像高是多少？',
  o:['12 cm','8 cm','1.3 cm'],a:0,
  h:'像距是物距的幾倍？像高就是物高的幾倍。',
  e:'像高 = 4 × 30 ÷ 10 = 12 cm。'},
 {q:'蠟燭到小孔的距離「等於」小孔到紙屏的距離，像和蠟燭比起來大小如何？',
  o:['像比較大','像和蠟燭一樣大（但是倒立）','像比較小'],a:1,
  h:'當像距 = 物距時，像距 ÷ 物距 等於多少？',
  e:'比值 = 1，所以像與物等大，只是上下顛倒。'},
 {q:'蠟燭高 8 cm，物距 30 cm，量得像高 4 cm，則像距是多少？',
  o:['15 cm','30 cm','60 cm'],a:0,
  h:'像高是物高的幾倍？像距就是物距的幾倍。',
  e:'4 ÷ 8 = 0.5，所以像距 = 30 × 0.5 = 15 cm。'},
 {q:'想讓紙屏上的像「比蠟燭還要小」，紙屏到小孔的距離應該怎麼調整？',
  o:['比蠟燭到小孔的距離短','比蠟燭到小孔的距離長','和蠟燭到小孔的距離相同'],a:0,
  h:'像要縮小，需要 像距 ÷ 物距 小於 1。',
  e:'像距 < 物距 時，像比蠟燭小。'},
 {q:'其他位置都不變，只把小孔「開大」，下列敘述何者正確？',
  o:['像的整體大小不變，但變得較亮、較模糊','像變得比較大，也比較清楚','像變得比較小，也比較暗'],a:0,
  h:'像的大小只由像距與物距決定，孔變大會影響什麼？可到實驗區試試看！',
  e:'孔徑不影響像的大小，但孔越大，像越亮也越模糊。'}
];
let P={idx:0,missed:false,locked:false,correct:0,wrong:0,res:[],started:false,done:false};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function updateScore(){ $('score').textContent='✅ 答對 '+P.correct+'　❌ 答錯 '+P.wrong; }
function updateBackBtn(){
  $('toPrac').textContent = P.done ? '📝 前往練習區（查看成績）'
    : P.started ? '📝 回到練習區，繼續作答（第 '+(P.idx+1)+' 題）'
    : '📝 前往練習區';
}
function resetFb(){ $('fb').className='fb'; $('fb').innerHTML=''; }
function renderQ(){
  const q=QS[P.idx];
  P.missed=false; P.locked=false;
  $('quiz').style.display='block'; $('result').style.display='none';
  $('qno').textContent='第 '+(P.idx+1)+' / '+QS.length+' 題';
  $('bar').style.width=(P.idx/QS.length*100)+'%';
  $('qtext').textContent=q.q;
  resetFb(); $('nextBtn').style.display='none';
  const box=$('opts'); box.innerHTML='';
  shuffle(q.o.map((t,i)=>({t,i}))).forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.t;
    b.onclick=()=>choose(b,o.i);
    box.appendChild(b);
  });
  updateScore(); updateBackBtn();
}
function choose(btn,i){
  if(P.locked) return;
  P.started=true;
  const q=QS[P.idx], fb=$('fb');
  if(i===q.a){
    P.locked=true; btn.classList.add('right');
    if(!P.missed){ P.correct++; P.res[P.idx]=true; } else { P.res[P.idx]=false; }
    [...$('opts').children].forEach(b=>b.disabled=true);
    fb.className=''; void fb.offsetWidth;
    fb.className='fb ok';
    fb.innerHTML='<span class="big">🎆</span> 答對了！'+q.e;
    fireworks(fb);
    $('nextBtn').textContent = P.idx===QS.length-1 ? '查看成績 🏆' : '下一題 ➜';
    $('nextBtn').style.display='inline-block';
    $('bar').style.width=((P.idx+1)/QS.length*100)+'%';
  } else {
    btn.classList.add('wrong'); btn.disabled=true;
    if(!P.missed){ P.missed=true; P.wrong++; }
    fb.className=''; void fb.offsetWidth;
    fb.className='fb bad';
    fb.innerHTML='🤔 再想一次！<br>💡 提示：'+q.h;
  }
  updateScore(); updateBackBtn();
}
$('nextBtn').onclick=()=>{
  if(P.idx>=QS.length-1) showResult();
  else { P.idx++; renderQ(); }
};
function showResult(){
  P.done=true;
  $('quiz').style.display='none'; $('result').style.display='block';
  $('resOk').textContent=P.correct; $('resBad').textContent=P.wrong;
  const msg = P.correct===10?'🎉 滿分！你完全掌握小孔成像了！'
    : P.correct>=8?'👏 很棒！只差一點點就滿分！'
    : P.correct>=6?'👍 不錯！再到實驗區試試看，會更熟悉喔！'
    : '💪 多到實驗區操作觀察，再來挑戰一次吧！';
  $('resTitle').textContent=msg;
  $('review').innerHTML=QS.map((_,i)=>'<span>第'+(i+1)+'題 '+(P.res[i]?'✅':'❌')+'</span>').join('');
  updateBackBtn();
  setTimeout(()=>fireworks($('result')),200);
}
$('restartBtn').onclick=()=>{
  P={idx:0,missed:false,locked:false,correct:0,wrong:0,res:[],started:false,done:false};
  renderQ();
};

/* =====================================================
 *  煙火特效
 * ===================================================== */
const fx=$('fx'), fc=fx.getContext('2d');
let parts=[], fxRun=false;
function resizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
resizeFx(); addEventListener('resize',resizeFx);
function burst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,
      decay:.012+Math.random()*.012,color:'hsl('+(hue+Math.random()*60)+',100%,60%)'});
  }
}
function fireworks(el){
  const r=el.getBoundingClientRect();
  const cxp=r.left+r.width/2, cyp=Math.max(80,r.top+r.height/2);
  [0,220,450].forEach((d,i)=>setTimeout(()=>{
    burst(cxp+(i-1)*Math.min(180,r.width/3)+(Math.random()-.5)*40, cyp-Math.random()*90);
    if(!fxRun){ fxRun=true; requestAnimationFrame(loopFx); }
  },d));
}
function loopFx(){
  fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.vx*=.985; p.life-=p.decay;
    fc.globalAlpha=Math.max(0,p.life); fc.fillStyle=p.color;
    fc.beginPath(); fc.arc(p.x,p.y,2.6,0,Math.PI*2); fc.fill();
  });
  fc.globalAlpha=1;
  if(parts.length) requestAnimationFrame(loopFx);
  else { fxRun=false; fc.clearRect(0,0,fx.width,fx.height); }
}

/* =====================================================
 *  初始化
 * ===================================================== */
renderQ();
refresh();
})();
